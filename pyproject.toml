[project]
name = "ai-video-generator"
version = "0.1.0"
description = "AI-powered pipeline for generating short documentary videos about Indian freedom fighters using LLMs, text-to-speech, image synthesis, and automated video assembly."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "colorlog>=6.7.0",
    "edge-tts>=6.1.9",
    "elevenlabs>=2.53.0",
    "google-generativeai>=0.8.6",
    "groq>=0.9.0",
    "gtts>=2.5.0",
    "moviepy>=1.0.3",
    "mutagen>=1.47.0",
    "nest-asyncio>=1.6.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "pydub>=0.25.1",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
]
